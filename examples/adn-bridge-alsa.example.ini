# adn-bridge — local ALSA audio peer (DMR <> local mic/speaker)
#
# ALSA<->DMR/YSF is wired into media_core (see
# docs-priv/alsa-peer-fase2-pcm-bridge.md) -- combine this stanza with a
# [peer.dmr] and/or [peer.ysf] stanza (see the other examples/ files) for a
# working layout (adn_bridge_config_valid requires at least two peers).
#
# Copy the [peer.*] block below into your config/adn-bridge.ini.

[peer.local]
type = alsa
enabled = true
# ALSA PCM device names (see: aplay -L / arecord -L). Can be the same
# device for capture+playback, or split across two sound cards.
capture_device = plughw:1,0
playback_device = plughw:1,0
# Capture gain applied after VOX's RMS measurement (0 < gain <= 4).
gain = 1.0
# ptt_type picks how the mic gets keyed: "vox" (default, below) or "gpio"
# (hardware COR/PTT switch on a GPIO pin -- see the block further down).
ptt_type = vox
# VOX (software) tuning -- calibrate vox_threshold on site (set log_level
# below to DEBUG to see live "vox rms=... threshold=..." lines and pick a
# value comfortably between your room-noise rms and your speaking rms);
# the rest mirror EchoLink's EL_HANG_MS/EL_TX_COOLDOWN_MS defaults.
vox_threshold = 500
vox_hang_ms = 700
vox_attack_ms = 80
tx_cooldown_ms = 800
# --- ptt_type = gpio (ignored when ptt_type = vox, the default above) ---
# Hardware COR/PTT: the mic is on-air exactly while the GPIO line is in its
# active state, no VOX/RMS involved. Requires building with WITH_GPIOD=1
# (libgpiod-dev). Uncomment and adjust to use it instead of vox_*:
# ptt_type = gpio
# gpio_chip = /dev/gpiochip0
# cor_gpio = 17          # line offset on gpio_chip
# cor_active = high      # "high" (default) or "low" -- pin polarity that means on-air
# cor_debounce_ms = 30   # stable reading required (either direction) before it counts
# No callsign/identity field here on purpose -- ALSA carries no identity of
# its own. When it transmits to DMR/YSF, traffic is attributed to the
# bridge's own [peer.dmr] callsign/dmrid (the existing identity fallback
# chain that already exists for "no identity resolved").
# Own vocoder connection -- required, and must NOT be shared with any
# [peer.el] vocoder_host/port (two PCM-native peers can't share one AMBE
# channel). Point this at a real md380-emu/AMBEServer instance.
vocoder_host = 127.0.0.1
vocoder_port = 2461
log_level = INFO
