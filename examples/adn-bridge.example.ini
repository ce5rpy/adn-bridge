# adn-bridge — master configuration example (peer bus model)
#
# Install default: /opt/adn-bridge/config/
#   cp examples/adn-bridge.example.ini config/adn-bridge.ini
#   ./adn-bridge -c config/adn-bridge.ini
#
# Supported layouts (exactly two enabled peers):
#   dmr + ysf        → YSF reflector <-> DMR
#   echolink + dmr   → EchoLink <-> DMR (vocoder_host/port on [peer.el])
#   echolink + ysf   → EchoLink <-> YSF (vocoder_host/port on [peer.el])
#
# Mode-specific templates:
#   examples/adn-bridge-ysf-dmr.example.ini
#   examples/adn-bridge-echolink-dmr.example.ini
#   examples/adn-bridge-echolink-ysf.example.ini
#
# Docs: docs/bridge.md · docs/bridge.es.md

[peer.fusion]
type = ysf
enabled = true
host = reflector.example.net
port = 42000
callsign = N0CALL
dgid = 1
log_level = INFO

[peer.master]
type = dmr
enabled = true
callsign = N0CALL
dmrid = 1234567
location = Example location
# freq — optional, default "000000000". RPTC announcement only (shown on
# the DMR network's monitor/dashboard) -- cosmetic, does not affect audio
# routing. Same 9-digit value is used for both RX and TX (no duplex here).
# freq = 445000000
description = adn-bridge
host = master.example.net
port = 62031
tg = 1234
# clear_dynamic_tg — optional, default false (omit or false).
#   true = on DMR login, silence-PTT TG 4000 first (drops leftover dynamic TGs),
#       then connect PTT to tg above. Useful on ADN masters; omit on XLX / no RPTO.
# clear_dynamic_tg = true
# block_private — optional, default true. Shown here at its default value.
#   true = drop DMR unit (private) calls instead of relaying them (default;
#       this bridge doesn't support private-call relay to YSF/EchoLink).
#   false = remove that explicit drop -- does NOT enable private-call relay
# block_private = true
options = TS2=1234;SINGLE=0;TIMER=60;
password = change-me
log_level = INFO

# EchoLink peer (uncomment for echolink-dmr or echolink-ysf; disable one radio peer above)
# [peer.el]
# type = echolink
# enabled = true
# callsign = N0CALL-L
# password = change-me
# bind_addr = 192.168.1.20
# host = *EXAMPLE*
# Inbound connections from OTHER EchoLink stations (e.g. the app), besides
# the outbound host= link above. max_inbound = 0 disables this entirely
# (only the outbound host= connection works, today's behavior). Default 1.
# allowed_callsigns is required to authorize any inbound connection -- an
# empty list rejects everyone (there is no "open node" mode).
# max_inbound = 1
# allowed_callsigns = N0CALL-L, N0CALL-R
# Explicit deny-list, checked before allowed_callsigns -- always wins even if
# the same callsign is also allowed above.
# blocked_callsigns = N0BAD-L
# qth = My QTH
# email = you@example.com
# directory_servers = server1.echolink.org, server2.echolink.org
# login_interval = 360
# station_list_interval = 600
# gain — optional PCM scale EchoLink → DMR/YSF before AMBE; default 1.0 (0 < gain <= 4).
#   ~0.5 often suits EchoLink↔YSF; 1.0 is typical for EchoLink↔DMR.
# gain = 1.0
# log_level = INFO
#
# vocoder_host = 127.0.0.1
# vocoder_port = 2460
# vocoder_log_level = INFO
# host = 192.168.1.50
# port = 2460

[aliases]
stale_minutes = 1440
reload_minutes = 15
data_dir = ./data
subscriber_file = subscriber_ids.json
subscriber_url = https://servers.adn.systems/subscriber_ids.json
local_subscriber_file = local_subcriber_ids.json
checksum_file = file_checksums.json
checksum_url = https://servers.adn.systems/file_checksums.json

[log]
level = INFO
# handlers = console          # stderr, no timestamp (journalctl already stamps each line)
# handlers = console-timed    # stderr with timestamp (default when stderr is a TTY)
# handlers = console,file-timed
# file = /var/log/adn-bridge/adn-bridge.log
# Omit handlers entirely for auto-detect: no timestamp under systemd/journal,
# timed when run manually from a terminal. SIGUSR2 reopens the file (logrotate).
