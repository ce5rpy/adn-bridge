# adn-bridge — master configuration example (all modes)
#
# Install default: /opt/adn-bridge/config/
#   cp examples/adn-bridge.example.ini config/adn-bridge.ini
#   ./adn-bridge -c config/adn-bridge.ini
#
# Pick ONE [bridge] mode. Mode-specific templates (only the stanzas that mode uses):
#   examples/adn-bridge-ysf-dmr.example.ini       → [ysf] [dmr] [aliases] [log]
#   examples/adn-bridge-echolink-dmr.example.ini  → [dmr] [echolink] [vocoder] [aliases] [log]
#   examples/adn-bridge-echolink-ysf.example.ini  → [ysf] [echolink] [vocoder] [aliases] [log]
#     (no [dmr] — that mode does not open a DMR peer)
#
# Docs: docs/ysf-dmr-bridge.md · docs/echolink-bridge.md
#       docs/ysf-dmr-bridge.es.md · docs/echolink-bridge.es.md
#
# Monitor "Bridges (IP)": callsign + dmrid identify this peer;
# RX/TX zero in RPTC → monitor shows N/A (software bridge, not hotspot).

[bridge]
# mode = ysf-dmr          ; YSF reflector <-> DMR
# mode = echolink-dmr     ; EchoLink <-> DMR (needs [vocoder]; no [ysf])
# mode = echolink-ysf     ; EchoLink <-> YSF (needs [vocoder]; no [dmr])
mode = ysf-dmr

# ---------------------------------------------------------------------------
# [ysf] — ysf-dmr, echolink-ysf
# ---------------------------------------------------------------------------
[ysf]
host = reflector.example.net
port = 42000
dgid = 1
log_level = INFO

# ---------------------------------------------------------------------------
# [dmr] — ysf-dmr, echolink-dmr only (omit entirely for echolink-ysf)
# ---------------------------------------------------------------------------
[dmr]
callsign    = N0CALL
dmrid       = 1234567
location    = Example location
description = adn-bridge
host        = master.example.net
port        = 62031
tg          = 1234
# On DMR login: silence-PTT TG 4000 first (drop dynamic TGs), then tg above
# clear_dynamic_tg = 1
# Optional RPTO string — omit or leave empty to skip RPTO.
# Not needed on XLX (and similar masters that do not use OPTIONS/RPTO): omit the line.
options     = TS2=1234;SINGLE=0;TIMER=60;
password    = change-me
log_level   = INFO

# ---------------------------------------------------------------------------
# [echolink] — echolink-dmr, echolink-ysf
# ---------------------------------------------------------------------------
[echolink]
# Must be a validated EchoLink -L / -R / *CONF* callsign
callsign = N0CALL-L
password = change-me
# Local IP to bind UDP 5198/5199 (ports are fixed in code).
# Not required if proxy_server is set.
bind_addr = 192.168.1.20
# Node or conference callsign (resolved via EchoLink directory)
# Examples: N0CALL-L  or  *SOMECONF*
host = *EXAMPLE*
qth = My QTH
email = you@example.com
directory_servers = server1.echolink.org, server2.echolink.org, server3.echolink.org, server4.echolink.org
login_interval = 360
station_list_interval = 600
# PCM scale EchoLink → DMR/YSF (before AMBE). Range: above 0 .. 4.
#   1.0 = no change (default, suggested for DMR) · 0.5 suggested for YSF
# gain = 1.0
# Optional EchoLink Proxy. Uncomment to use NAT proxy instead of
# local UDP 5198/5199 (then bind_addr is unused):
# proxy_server = your.proxy.example
# proxy_port = 8100
# proxy_password = PUBLIC
log_level = INFO

# ---------------------------------------------------------------------------
# [vocoder] — echolink-dmr, echolink-ysf
# ---------------------------------------------------------------------------
[vocoder]
# Hardware AMBE vocoder (DV3000 / AMBEServer UDP)
host = 127.0.0.1
port = 2460
log_level = INFO

# Subscriber aliases — same files/URLs as adn-server ALIASES block
[aliases]
stale_minutes = 1440
reload_minutes = 15
data_dir = ./data
subscriber_file = subscriber_ids.json
subscriber_url = https://servers.adn.systems/subscriber_ids.json
local_subscriber_file = local_subcriber_ids.json
checksum_file = file_checksums.json
checksum_url = https://servers.adn.systems/file_checksums.json

[log]
level = INFO
