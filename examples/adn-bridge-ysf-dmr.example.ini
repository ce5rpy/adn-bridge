# adn-bridge — mode ysf-dmr (YSF reflector <-> DMR)
# Master (all modes): examples/adn-bridge.example.ini
# Copy and edit: cp examples/adn-bridge-ysf-dmr.example.ini config/adn-bridge.ini
# Docs: docs/ysf-dmr-bridge.md / docs/ysf-dmr-bridge.es.md

[bridge]
mode = ysf-dmr

[ysf]
host = reflector.example.net
port = 42000
dgid = 1
log_level = INFO

[dmr]
callsign    = N0CALL
dmrid       = 1234567
location    = Example location
description = adn-bridge
host        = master.example.net
port        = 62031
tg          = 1234
# On DMR login: silence-PTT TG 4000 first (drop dynamic TGs), then tg above
# clear_dynamic_tg = 1
# Optional RPTO string — omit or leave empty to skip RPTO.
# Not needed on XLX (and similar masters that do not use OPTIONS/RPTO): omit the line.
options     = TS2=1234;SINGLE=0;TIMER=60;
password    = change-me
log_level   = INFO

# Subscriber aliases — same files/URLs as adn-server ALIASES block
[aliases]
stale_minutes = 1440
reload_minutes = 15
data_dir = ./data
subscriber_file = subscriber_ids.json
subscriber_url = https://servers.adn.systems/subscriber_ids.json
local_subscriber_file = local_subcriber_ids.json
checksum_file = file_checksums.json
checksum_url = https://servers.adn.systems/file_checksums.json

[log]
level = INFO
