# adn-bridge — mode echolink-ysf (EchoLink <-> YSF)
# Master (all modes): examples/adn-bridge.example.ini
# Copy and edit: cp examples/adn-bridge-echolink-ysf.example.ini config/adn-bridge.ini
# Docs: docs/echolink-bridge.md / docs/echolink-bridge.es.md
#
# No [dmr] stanza — this mode does not open a DMR peer.

[bridge]
mode = echolink-ysf

[ysf]
host = reflector.example.net
port = 42000
dgid = 3
log_level = INFO

[echolink]
callsign = N0CALL-L
password = change-me
# Local IP to bind UDP 5198/5199. Not required if proxy_server is set.
bind_addr = 192.168.1.20
host = *EXAMPLE*
directory_servers = server1.echolink.org, server2.echolink.org, server3.echolink.org, server4.echolink.org
login_interval = 360
station_list_interval = 600
# PCM scale EchoLink → YSF (before AMBE). Range: above 0 .. 4.
#   1.0 = no change (default) · 0.5 suggested for YSF · 1.0 suggested for DMR
# gain = 0.5
# Optional EchoLink Proxy (then bind_addr is unused):
# proxy_server = your.proxy.example
# proxy_port = 8100
# proxy_password = PUBLIC
log_level = INFO

[vocoder]
# Hardware AMBE vocoder (DV3000 / AMBEServer UDP)
host = 127.0.0.1
port = 2460
log_level = INFO

[aliases]
stale_minutes = 1440
reload_minutes = 15
data_dir = ./data
subscriber_file = subscriber_ids.json
subscriber_url = https://servers.adn.systems/subscriber_ids.json
local_subscriber_file = local_subcriber_ids.json
checksum_file = file_checksums.json
checksum_url = https://servers.adn.systems/file_checksums.json

[log]
level = INFO
