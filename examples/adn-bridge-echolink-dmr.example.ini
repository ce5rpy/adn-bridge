# adn-bridge — EchoLink <-> DMR (peer bus model)
# Copy and edit: cp examples/adn-bridge-echolink-dmr.example.ini config/adn-bridge.ini
# Docs: docs/bridge.md · docs/bridge.es.md

[peer.master]
type = dmr
enabled = true
callsign = N0CALL
dmrid = 1234567
location = DMR <> ECHOLINK
description = adn-bridge
host = master.example.net
port = 62031
tg = 9
# clear_dynamic_tg — optional, default off (omit or 0).
#   1 = on DMR login, silence-PTT TG 4000 first (drops leftover dynamic TGs),
#       then connect PTT to tg above. Useful on ADN masters; omit on XLX / no RPTO.
# clear_dynamic_tg = 1
options = TS2=9;SINGLE=0;
password = change-me
log_level = INFO

[peer.el]
type = echolink
enabled = true
# Must be a validated EchoLink -L / -R / *CONF* callsign
callsign = N0CALL-L
password = change-me
# Local IP to bind UDP 5198/5199 (not required if proxy_server is set)
bind_addr = 192.168.1.20
# Node or conference callsign (resolved via EchoLink directory)
host = *EXAMPLE*
qth = My QTH
email = you@example.com
directory_servers = server1.echolink.org, server2.echolink.org, server3.echolink.org, server4.echolink.org
login_interval = 360
station_list_interval = 600
# gain = 1.0
# proxy_server = your.proxy.example
# proxy_port = 8100
# proxy_password = PUBLIC
vocoder_host = 127.0.0.1
vocoder_port = 2460
vocoder_log_level = INFO
log_level = INFO

[aliases]
stale_minutes = 1440
reload_minutes = 0
data_dir = ./data
subscriber_file = subscriber_ids.json
subscriber_url = https://servers.adn.systems/subscriber_ids.json
local_subscriber_file = local_subcriber_ids.json
checksum_file = file_checksums.json
checksum_url = https://servers.adn.systems/file_checksums.json

[log]
level = INFO
# handlers = console          # stderr, no timestamp (journalctl already stamps each line)
# handlers = console-timed    # stderr with timestamp (default when stderr is a TTY)
# handlers = console,file-timed
# file = /var/log/adn-bridge/adn-bridge.log
# Omit handlers entirely for auto-detect: no timestamp under systemd/journal,
# timed when run manually from a terminal. SIGHUP reopens the file (logrotate).
