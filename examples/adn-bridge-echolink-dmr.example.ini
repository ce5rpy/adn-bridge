# adn-bridge — EchoLink <-> DMR (peer bus model)
# Copy and edit: cp examples/adn-bridge-echolink-dmr.example.ini config/adn-bridge.ini
# Docs: docs/bridge.md · docs/bridge.es.md

[peer.master]
type = dmr
enabled = true
callsign = N0CALL
dmrid = 1234567
location = DMR <> ECHOLINK
description = adn-bridge
host = master.example.net
port = 62031
tg = 9
# clear_dynamic_tg — optional, default off (omit or 0).
#   1 = on DMR login, silence-PTT TG 4000 first (drops leftover dynamic TGs),
#       then connect PTT to tg above. Useful on ADN masters; omit on XLX / no RPTO.
# clear_dynamic_tg = 1
# block_private — optional, default on (omit or 1).
#   1 = drop DMR unit (private) calls instead of relaying them (default;
#       this bridge doesn't support private-call relay to YSF/EchoLink).
#   0 = remove that explicit drop -- does NOT enable private-call relay
# block_private = 0
options = TS2=9;SINGLE=0;
password = change-me
log_level = INFO

[peer.el]
type = echolink
enabled = true
# Must be a validated EchoLink -L / -R / *CONF* callsign
callsign = N0CALL-L
password = change-me
# Local IP to bind UDP 5198/5199 (not required if proxy_server is set)
bind_addr = 192.168.1.20
# Node or conference callsign (resolved via EchoLink directory)
host = *EXAMPLE*
qth = My QTH
email = you@example.com
# Inbound connections from OTHER EchoLink stations (e.g. the app), besides
# the outbound host= link above. max_inbound = 0 disables this entirely
# (only the outbound host= connection works, today's behavior). Default 1.
# allowed_callsigns is required to authorize any inbound connection -- an
# empty list rejects everyone (there is no "open node" mode).
max_inbound = 1
allowed_callsigns = N0CALL-L, N0CALL-R
# Explicit deny-list, checked before allowed_callsigns -- always wins even if
# the same callsign is also allowed above.
# blocked_callsigns = N0BAD-L
# Appended to the "connected users" list shown in the app (which also tags
# each station TX/RX depending on who's currently transmitting). Literal
# "\n" becomes a real line break -- multi-line is fine.
# welcome_text = Welcome to my node!\nPlease keep QSOs on-topic.
directory_servers = server1.echolink.org, server2.echolink.org, server3.echolink.org, server4.echolink.org
login_interval = 360
station_list_interval = 600
# gain = 1.0
# proxy_server = your.proxy.example
# proxy_port = 8100
# proxy_password = PUBLIC
vocoder_host = 127.0.0.1
vocoder_port = 2460
vocoder_log_level = INFO
log_level = INFO

[aliases]
stale_minutes = 1440
reload_minutes = 0
data_dir = ./data
subscriber_file = subscriber_ids.json
subscriber_url = https://servers.adn.systems/subscriber_ids.json
local_subscriber_file = local_subcriber_ids.json
checksum_file = file_checksums.json
checksum_url = https://servers.adn.systems/file_checksums.json

[log]
level = INFO
# handlers = console          # stderr, no timestamp (journalctl already stamps each line)
# handlers = console-timed    # stderr with timestamp (default when stderr is a TTY)
# handlers = console,file-timed
# file = /var/log/adn-bridge/adn-bridge.log
# Omit handlers entirely for auto-detect: no timestamp under systemd/journal,
# timed when run manually from a terminal. SIGUSR2 reopens the file (logrotate).
