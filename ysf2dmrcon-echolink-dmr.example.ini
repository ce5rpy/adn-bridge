# ysf2dmrcon — EchoLink <-> DMR example (no real passwords)
# Copy to a local INI and edit. Run: ./ysf2dmrcon -c your.ini

[bridge]
mode = echolink-dmr

[dmr]
callsign    = N0CALL
dmrid       = 1234567
location    = DMR <> ECHOLINK
description = ysf2dmrcon
host        = master.example.net
port        = 62031
tg          = 9
options     = TS2=9;SINGLE=0;
password    = change-me

[echolink]
# Must be a validated EchoLink -L / -R / *CONF* callsign
callsign = N0CALL-L
password = change-me
# Local IP to bind UDP 5198/5199 (ports are fixed in code)
bind_addr = 192.168.1.20
# Node or conference callsign (resolved via EchoLink directory)
# Examples: N0CALL-L  or  *SOMECONF*
host = *EXAMPLE*
qth = My QTH
email = you@example.com
directory_servers = server1.echolink.org, server2.echolink.org, server3.echolink.org, server4.echolink.org
# Same as tlb LoginInterval / StationListInterval (seconds)
login_interval = 360
station_list_interval = 600
# PCM scale EchoLink → DMR (before AMBE encode). Range: above 0 .. 4.
#   1.0 = unchanged (default) · 0.5 ≈ −6 dB · 4.0 = max
# gain = 0.5

[vocoder]
# AMBEServer / DV3000-compatible remote (soft or hardware)
host = 127.0.0.1
port = 2460

[aliases]
stale_minutes = 1440
reload_minutes = 0
data_dir = ./data
subscriber_file = subscriber_ids.json
subscriber_url = https://servers.adn.systems/subscriber_ids.json

# Per-channel levels (optional). Unset → inherit [log] level=
# [dmr] log_level = DEBUG
# [echolink] log_level = INFO
# [vocoder] log_level = WARNING

[log]
level = INFO
# Or set channels here: echolink= / dmr= / ysf= / vocoder=
