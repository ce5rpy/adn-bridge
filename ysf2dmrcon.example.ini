# ysf2dmrcon — copy to ysf2dmrcon.ini (or another name) and edit.
# Run: ./ysf2dmrcon -c ysf2dmrcon.ini
# See README.md / README.es.md for identity rules and multi-instance notes.
#
# Monitor "Bridges (IP)": callsign + dmrid identify this peer;
# RX/TX zero in RPTC → monitor shows N/A (software bridge, not hotspot).

[ysf]
host = 192.0.2.10
port = 42000
dgid = 1

[dmr]
callsign    = N0CALL
dmrid       = 1234567
location    = Example location
description = ysf2dmrcon example
host        = dmr.example.net
port        = 62031
tg          = 1234
# Optional RPTO string — omit or leave empty to skip RPTO
options     = TS2=1234;SINGLE=0;TIMER=60;
password    = changeme

# Subscriber aliases — same files/URLs as new-adn-server ALIASES block
# Downloads are always attempted when URL is set (no try_download flag).
[aliases]
# Re-download when file age exceeds this many minutes (also while running).
# Default 1440 = 24 hours. 0 = always download on start only (no periodic download).
stale_minutes = 1440
# Check this often whether on-disk JSON is newer than RAM; if so, rebuild tables.
# If the subscriber file is missing, forces a download.
# Useful when another instance updates a shared data_dir. 0 = disable.
reload_minutes = 15
data_dir = ./data
subscriber_file = subscriber_ids.json
subscriber_url = https://example.com/subscriber_ids.json
local_subscriber_file = local_subcriber_ids.json
# Optional blake2b manifest (key subscriber_ids). If missing, valid JSON is enough.
checksum_file = file_checksums.json
checksum_url = https://example.com/file_checksums.json

# Log verbosity: DEBUG | INFO | WARNING | ERROR
[log]
level = INFO
