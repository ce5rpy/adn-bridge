# ysf2dmrcon — YSF <-> DMR example (default mode)
# Same content as ysf2dmrcon-ysf-dmr.example.ini — kept as the short name
# for: cp ysf2dmrcon.example.ini ysf2dmrcon.ini
#
# See docs/ysf-dmr-bridge.md / docs/ysf-dmr-bridge.es.md
# Monitor "Bridges (IP)": callsign + dmrid identify this peer;
# RX/TX zero in RPTC → monitor shows N/A (software bridge, not hotspot).

[bridge]
mode = ysf-dmr

[ysf]
host = reflector.example.net
port = 42000
dgid = 1

[dmr]
callsign    = N0CALL
dmrid       = 1234567
location    = Example location
description = ysf2dmrcon
host        = master.example.net
port        = 62031
tg          = 1234
# Optional RPTO string — omit or leave empty to skip RPTO
options     = TS2=1234;SINGLE=0;TIMER=60;
password    = change-me

# Subscriber aliases — same files/URLs as new-adn-server ALIASES block
[aliases]
stale_minutes = 1440
reload_minutes = 15
data_dir = ./data
subscriber_file = subscriber_ids.json
subscriber_url = https://example.com/subscriber_ids.json
local_subscriber_file = local_subcriber_ids.json
checksum_file = file_checksums.json
checksum_url = https://example.com/file_checksums.json

# Per-channel levels (optional). Unset → inherit [log] level=
# [dmr] log_level = DEBUG
# [ysf] log_level = INFO

[log]
level = INFO
