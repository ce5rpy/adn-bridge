# python-semantic-release config for ysf2dmrcon (C project — not a Python package).
# Baseline 0.0.1 so the first release on master (feat: in history) publishes 0.1.0.
# CI: .github/workflows/release.yml (config_file = this file).

[semantic_release]
build_command = ""
tag_format = "v{version}"
commit_message = "chore(release): {version}"
# Canonical version for a C tree: plain VERSION file (+ stamps below).
version_variables = [
  "VERSION:*:nf",
  "ysf2dmrcon.c:YSF2DMR_VERSION",
  "README.md:**Version",
  "README.es.md:**Versión",
]
allow_zero_version = true
major_on_zero = false

[semantic_release.branches.master]
match = "master"
prerelease = false

[semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[semantic_release.changelog.default_templates]
mode = "update"
changelog_file = "CHANGELOG.md"

[semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[semantic_release.remote.token]
env = "GH_TOKEN"
