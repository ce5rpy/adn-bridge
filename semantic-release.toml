# python-semantic-release config for adn-bridge (C project — not a Python package).
# Baseline 0.0.1 so the first release on master (feat: in history) publishes 0.1.0.
# CI: .github/workflows/release.yml (config_file = this file).

[semantic_release]
build_command = ""
tag_format = "v{version}"
commit_message = "chore(release): {version}"
# Canonical version for a C tree: plain VERSION file (+ stamps below).
version_variables = [
  "VERSION:*:nf",
  "adn_bridge.c:ADN_BRIDGE_VERSION",
  "README.md:**Version",
  "README.es.md:**Versión",
]
allow_zero_version = true
# Allow BREAKING CHANGE / feat! on 0.x to publish 1.0.0 (default false → 0.y.0).
major_on_zero = true

[semantic_release.branches.master]
match = "master"
prerelease = false

[semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[semantic_release.changelog.default_templates]
mode = "update"
changelog_file = "CHANGELOG.md"

[semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[semantic_release.remote.token]
env = "GH_TOKEN"
