# ysf2dmrcon — EchoLink <-> YSF example (no real passwords)

[bridge]
mode = echolink-ysf

[ysf]
host = reflector.example.net
port = 42000
dgid = 3

[dmr]
# Identity still required for callsign/dmrid fields used on YSF wire
callsign    = N0CALL
dmrid       = 1234567
password    = unused-for-ysf-mode

[echolink]
callsign = N0CALL-L
password = change-me
bind_addr = 192.168.1.20
host = *EXAMPLE*
directory_servers = server1.echolink.org, server2.echolink.org, server3.echolink.org, server4.echolink.org
login_interval = 360
station_list_interval = 600

[vocoder]
host = 127.0.0.1
port = 2460

[log]
level = INFO
