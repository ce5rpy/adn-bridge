# ysf2dmrcon — EchoLink <-> YSF example (no real passwords)
# See docs/echolink-bridge.md / docs/echolink-bridge.es.md

[bridge]
mode = echolink-ysf

[ysf]
host = reflector.example.net
port = 42000
dgid = 3

[dmr]
# Wire identity for YSFD / CSD (no DMR peer is opened in this mode)
callsign    = N0CALL
dmrid       = 1234567
password    = unused-for-ysf-mode

[echolink]
callsign = N0CALL-L
password = change-me
# Local IP to bind UDP 5198/5199. Not required if proxy_server is set.
bind_addr = 192.168.1.20
host = *EXAMPLE*
directory_servers = server1.echolink.org, server2.echolink.org, server3.echolink.org, server4.echolink.org
login_interval = 360
station_list_interval = 600
# PCM scale EchoLink → YSF (before AMBE). Range: above 0 .. 4.
#   1.0 = no change (default) · 0.5 suggested for YSF · 1.0 suggested for DMR
# gain = 0.5
# Optional EchoLink Proxy. Uncomment to use NAT proxy instead of
# local UDP 5198/5199 (then bind_addr is unused):
# proxy_server = your.proxy.example
# proxy_port = 8100
# proxy_password = PUBLIC


[vocoder]
# Hardware AMBE vocoder (DV3000 / AMBEServer UDP)
host = 127.0.0.1
port = 2460

# [ysf] log_level = DEBUG
# [echolink] log_level = INFO
# [vocoder] log_level = WARNING

[log]
level = INFO
